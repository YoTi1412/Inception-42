services:
  nginx:
    container_name: nginx
    build: 
      context: ./requirements/nginx
      dockerfile: Dockerfile
    depends_on:
      - wordpress
      - static-page
    ports:
      - 443:443
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - network
    env_file:
      - .env

  static-page:
    container_name: static-page
    build:
      context: ./requirements/bonus/static_page
      dockerfile: Dockerfile
    restart: always
    networks:
      - network
    env_file:
      - .env

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network
    restart: always
    env_file:
      - .env

  wordpress:
    container_name: wordpress
    depends_on:
      - mariadb
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - network

  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    ports:
      - '6379:6379'
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - network
  
  ftp_server:
    container_name: ftp_server
    depends_on:
      - nginx
      - redis
    build:
      context: ./requirements/bonus/ftp_server
      dockerfile: Dockerfile
    restart: always
    ports:
      - 21:21
      - 21100-21110:21100-21110
    env_file:
      - .env
    networks:
      - network
    volumes:
      - wordpress_data:/var/www/html
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASSWORD=${FTP_PASSWORD}

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/yoti/data/mysql
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/yoti/data/wordpress
      o: bind

networks:
  network:
    driver: bridge