# =======================
# Main HTTPS server block for yrafai.42.fr
# =======================
server {
    # Listen on HTTPS (port 443) with SSL enabled, both IPv4 and IPv6
    listen 443 ssl;
    listen [::]:443 ssl;

    # Domain name for this server
    server_name yrafai.42.fr;

    # SSL/TLS certificate and key (self-signed cert)
    ssl_certificate /etc/nginx/ssl/yrafai.crt;         # Public certificate file
    ssl_certificate_key /etc/nginx/ssl/yrafai.key;     # Private key file
    ssl_protocols TLSv1.3;                   # Restrict to secure TLS versions

    # Document root where files will be served from (default for WordPress/static files)
    root /var/www/html;
    index index.php index.html;  # Default index files

    # =======================
    # Proxy /static/ requests to the static-page container
    # =======================
    location /static/ {
        proxy_pass http://static-page:80/;   # Forward requests to the static-page container on port 80
        proxy_set_header Host $host;         # Preserve original host
        proxy_set_header X-Real-IP $remote_addr;  # Pass real client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Forward chain of IPs
        proxy_set_header X-Forwarded-Proto $scheme; # Forward original scheme (https/http)
    }

    # =======================
    # Default location for other paths
    # =======================
    location / {
        # Serve file if it exists, else fallback to index.php with query args
        try_files $uri $uri/ /index.php?$args;
    }

    # =======================
    # PHP handling for WordPress
    # =======================
    location ~ \.php$ {
        include fastcgi_params;    # Load default FastCGI parameters
        fastcgi_pass wordpress:9000;  # Pass PHP requests to the wordpress container on port 9000 (php-fpm)
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # Full path to script
    }

    # =======================
    # Adminer web interface (DB management)
    # =======================
    location ~ ^/adminer(/.*$|$) {
        proxy_pass http://adminer:8080;   # Forward to Adminer container
        proxy_set_header Host $host;      # Preserve host
        proxy_set_header X-Real-IP $remote_addr; # Pass real IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Forward IP chain
        proxy_set_header X-Forwarded-Proto $scheme; # Forward original scheme
    }
}

# =======================
# HTTPS server block for Portainer UI
# =======================
server {
    # Listen on HTTPS (port 443) for portainer.yrafai.42.fr
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portainer.yrafai.42.fr;

    # Use same SSL certificate as main site
    ssl_certificate /etc/nginx/ssl/yrafai.crt;
    ssl_certificate_key /etc/nginx/ssl/yrafai.key;
    ssl_protocols TLSv1.3;

    # =======================
    # Proxy all requests to Portainer container
    # =======================
    location / {
        proxy_pass http://portainer:9000;  # Forward to Portainer container on port 9000
        proxy_set_header Host $host;       # Preserve host
        proxy_set_header X-Real-IP $remote_addr; # Pass client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Forward IP chain
        proxy_set_header X-Forwarded-Proto $scheme; # Forward original scheme

        # WebSocket support for Portainer
        proxy_http_version 1.1;   # Needed for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
