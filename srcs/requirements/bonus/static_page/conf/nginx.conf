server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html/public;
    index index.html;

    location / {
        try_files $uri $uri/ /404.html;
    }

    location = /404 {
        try_files /404.html =404;
    }

    error_page 404 /404;
    location = /404.html {
        internal;
    }
}